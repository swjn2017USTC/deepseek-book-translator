[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chapter-structure-recovery-lab"
version = "0.15.0"
description = "Recover auditable book chapter structures from PaddleOCR JSON"
requires-python = ">=3.9"

[project.scripts]
chapter-recovery = "chapter_recovery.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
