interface:
  display_name: "DeepSeek Book Translation"
  short_description: "Translate OCR/PDF or normalized EPUB through reviewed Markdown"
  default_prompt: "Use $deepseek-book-translation to translate my OCR JSON/PDF or EPUB into Chinese. For EPUB, normalize it locally into canonical reviewed-source Markdown/assets first; for OCR use structure recovery/Vision. Then ask whether I want manual source review and use the approved canonical source for terminology, contextual micro-batch translation, QA and standardized publishing."
